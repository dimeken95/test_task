events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Docker's embedded DNS, re-resolved so `docker compose up --scale api=N`
  # is picked up without restarting the gateway.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;

    # Uploads stream through; buffering a 200 MiB video on the proxy would
    # defeat the point of streaming it in the app.
    proxy_request_buffering off;
    proxy_buffering         off;
    client_max_body_size    0;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    location / {
      set $upstream http://api:8080;
      proxy_pass $upstream;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
