# Local topology mirrors the Kubernetes one: a stateless API tier and a
# separate worker tier, both horizontally scalable.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.yml up -d --scale api=3 --scale worker=4
#
# The API sits behind nginx and publishes no host ports of its own, so scaling
# it does not collide on port 8080.

x-app-env: &app-env
  DATABASE_URL: postgres://payload:payload@postgres:5432/payload?sslmode=disable
  S3_ENDPOINT: http://minio:9000
  S3_PRESIGN_ENDPOINT: http://minio:9000
  S3_BUCKET: payloads
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_USE_PATH_STYLE: "true"
  MOCK_PROCESSOR_URL: http://mockprocessor:8090
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  SERVICE_NAME: payload-service
  MIGRATIONS_DIR: /app/migrations
  LOG_LEVEL: info

x-app-build: &app-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payload
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - miniodata:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/payloads &&
      exit 0
      "

  # The external service whose implementation the assignment asks us to mock.
  mockprocessor:
    build: *app-build
    restart: unless-stopped
    entrypoint: ["/app/mockprocessor"]
    environment:
      HTTP_ADDR: ":8090"
      SERVICE_NAME: mock-processor
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "8090:8090"

  # Stateless HTTP tier. No host port: nginx fans out to every replica.
  api:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_MODE: api
      HTTP_ADDR: ":8080"
      MAX_CONCURRENT_UPLOADS: "16"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  # Queue consumers. Scale these independently of the API tier.
  worker:
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_MODE: worker
      HTTP_ADDR: ":8080"
      WORKER_CONCURRENCY: "4"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      mockprocessor:
        condition: service_started

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    expose:
      - "4318"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
